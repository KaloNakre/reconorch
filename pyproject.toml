[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconorch"
version = "0.1.0"
description = "Ray + subprocess based orchestrator for CLI security scanning tools"
requires-python = ">=3.10"
dependencies = [
    "ray>=2.9",
    "PyYAML>=6.0",
]

[project.scripts]
reconorch = "reconorch.cli:main"

[tool.setuptools.packages.find]
include = ["reconorch*"]
